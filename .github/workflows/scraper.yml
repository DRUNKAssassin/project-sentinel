name: Daily Sentinel Scraper

on:
  schedule:
    # Runs automatically every day at midnight UTC (5:30 AM IST)
    - cron: '0 0 * * *' 
  workflow_dispatch: # Adds a button in GitHub to run it manually anytime

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    # Grants permission to push the updated processed_links.txt back to your repo
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai youtube-transcript-api requests python-dotenv

      - name: Run Sentinel Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python gems_scraper.py

      - name: Commit Updated History
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add processed_links.txt
          
          # This checks if new links were added. If yes, it commits and pushes them to save state.
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update processed links" && git push)